name: Build and Upload Release Images

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release:
        description: 'Target release'
        required: false
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          - noble
          - trixie
          - plucky
          - forky

env:
  BOARD: orangepi4pro
  BRANCH: next
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  build-bookworm-server:
    name: Bookworm Server
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.release == 'bookworm' || inputs.release == ''))
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc make bc bison flex libssl-dev \
            libc6-dev-arm64-cross gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            qemu-user-static binfmt-support dpkg-dev xz-utils pigz
      - name: Enable binfmt
        run: sudo systemctl restart systemd-binfmt
      - name: Clone Armbian build system
        run: git clone --depth=1 https://github.com/armbian/build.git armbian-build
      - name: Clone overlay
        run: git clone --depth=1 https://github.com/${{ github.repository }}.git overlay
      - name: Apply overlay
        run: ./overlay/scripts/apply-overlay.sh ./armbian-build
      - name: Build image
        working-directory: armbian-build
        run: |
          ./compile.sh \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ env.BRANCH }} \
            RELEASE=bookworm \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            NO_HOST_RELEASE_CHECK=yes \
            COMPRESS_OUTPUTIMAGE=no \
            BUILD_OPT=image
      - name: Compress image
        working-directory: armbian-build
        run: |
          IMG=$(find output/images -name '*.img' | head -1)
          echo "Compressing: $IMG ($(du -h "$IMG" | cut -f1))"
          xz -6 -T0 "$IMG" || true
          ls -lh "${IMG}.xz" 2>/dev/null || { echo "ERROR: xz output not found"; exit 1; }
          echo "IMAGE_PATH=$(realpath "${IMG}.xz")" >> $GITHUB_ENV
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IMAGE_PATH }}
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Orangepi4pro-bookworm-server
          path: ${{ env.IMAGE_PATH }}

