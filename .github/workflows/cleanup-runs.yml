name: Cleanup Old Workflow Runs

on:
  schedule:
    # Run daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete completed runs older than X days'
        required: true
        default: '7'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete Runs Older than 7 Days
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '7' }}
        run: |
          CUTOFF_DATE=$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Current UTC Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Retention Days:   ${RETENTION_DAYS} days"
          echo "Cutoff Timestamp: ${CUTOFF_DATE}"
          echo "Repository:       ${GH_REPO}"
          
          PAGE=1
          DELETED_TOTAL=0
          
          while true; do
            echo "Fetching runs (page ${PAGE})..."
            RUNS=$(gh api "repos/${GH_REPO}/actions/runs?per_page=100&page=${PAGE}" \
              --jq ".workflow_runs[] | select(.status == \"completed\" and .created_at < \"${CUTOFF_DATE}\") | \"\(.id) \(.name) (\(.created_at))\"" 2>/dev/null || true)
            
            if [ -z "${RUNS}" ]; then
              echo "No more completed runs older than ${CUTOFF_DATE} found."
              break
            fi
            
            PAGE_DELETED=0
            while IFS= read -r run_line; do
              [ -n "${run_line}" ] || continue
              RUN_ID=$(echo "${run_line}" | awk '{print $1}')
              RUN_DESC=$(echo "${run_line}" | cut -d' ' -f2-)
              echo "Deleting run ${RUN_ID}: ${RUN_DESC}..."
              if gh api -X DELETE "repos/${GH_REPO}/actions/runs/${RUN_ID}" --silent 2>/dev/null; then
                DELETED_TOTAL=$((DELETED_TOTAL + 1))
                PAGE_DELETED=$((PAGE_DELETED + 1))
              fi
            done <<< "${RUNS}"
            
            if [ "${PAGE_DELETED}" -eq 0 ]; then
              PAGE=$((PAGE + 1))
            fi
            
            sleep 1
          done
          
          echo "=========================================================="
          echo " Successfully deleted ${DELETED_TOTAL} workflow runs older than ${RETENTION_DAYS} days."
          echo "=========================================================="
