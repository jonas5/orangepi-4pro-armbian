# Allwinner A733 octa core 2-16GB RAM GBE USB3 WiFi/BT NVMe eMMC
BOARD_NAME="Orange Pi 4 Pro"
BOARD_VENDOR="xunlong"
BOARDFAMILY="sun60iw2"
BOOTCONFIG="sun60iw2p1_t736_defconfig"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="allwinner/sun60i-a733-orangepi-4-pro.dtb"
MODULES="aic8800_fdrv aic8800_btlpm"
KERNEL_TARGET="current,next"
DISTRIB_TYPE_CURRENT="bookworm jammy bullseye trixie"
SKIP_BOOTSPLASH="yes"
REVISION="1.0.7"

# Per-board U-Boot boot blobs (required by sun60iw2 uboot_custom_postprocess)
SUNXI_BOOT0_SDCARD_FEX="${SRC}/packages/blobs/sunxi/sun60iw2/boot0_sdcard_orangepi4pro.fex"
SUNXI_BOOT0_SPINOR_FEX="${SRC}/packages/blobs/sunxi/sun60iw2/boot0_spinor_orangepi4pro.fex"
SUNXI_SYS_CONFIG_FEX="${SRC}/packages/blobs/sunxi/sun60iw2/sys_config_orangepi.fex"

# Invalidate U-Boot cache if any of the blobs change
UBOOT_HASH_EXTRA="$(cat "${SUNXI_BOOT0_SDCARD_FEX}" "${SUNXI_BOOT0_SPINOR_FEX}" "${SUNXI_SYS_CONFIG_FEX}" | sha256sum | cut -d' ' -f1)"

# AIC8800D80 combo: BT is UART HCI on ttyS1 and needs userspace bring-up
SUN60IW2_UART_BT="yes"

# Override kernel source for next (mainline) branch
function post_family_config_branch_next__orangepi4pro_mainline_kernel() {
	declare -g KERNELSOURCE="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
	declare -g KERNELBRANCH="tag:v7.1.5"
	declare -g KERNEL_MAJOR_MINOR="7.1"
	declare -g LINUXCONFIG="linux-sun60iw2-next-a733"
	declare -g KERNELPATCHDIR="sun60iw2-next"
	declare -g KERNEL_USE_GCC='> 10.0'
}

# Fix VER and rename debs for mainline kernels
function post_family_tweaks__orangepi4pro_kernel_ver() {
	if [[ ${BRANCH} == next ]]; then
		local kernel_version
		kernel_version=$(dpkg-deb -I "${DEB_STORAGE}/${CHOSEN_KERNEL}_${REVISION}_${ARCH}.deb" | awk -F"[()]" '/Version:/{print $2}')
		[[ -n "$kernel_version" ]] && VER="${kernel_version}"
		display_alert "Fixed kernel VER" "$VER" "info"

		local expected_prefix="linux-image-${BRANCH}-${LINUXFAMILY}"
		local expected_dtb="linux-dtb-${BRANCH}-${LINUXFAMILY}"
		local expected_hdr="linux-headers-${BRANCH}-${LINUXFAMILY}"
		for f in "${DEB_STORAGE}"/linux-image-[0-9]*"${LINUXFAMILY}"*_${REVISION}_${ARCH}.deb; do
			[[ -f "$f" ]] || continue
			local bname=$(basename "$f")
			[[ "$bname" == *"dbg"* ]] && continue
			if [[ "$bname" != "${expected_prefix}_"* ]]; then
				display_alert "Renaming kernel deb" "$bname -> ${expected_prefix}_${REVISION}_${ARCH}.deb" "wrn"
				mv "$f" "${DEB_STORAGE}/${expected_prefix}_${REVISION}_${ARCH}.deb"
			fi
		done
		for f in "${DEB_STORAGE}"/linux-dtb-[0-9]*"${LINUXFAMILY}"*_${REVISION}_${ARCH}.deb; do
			[[ -f "$f" ]] || continue
			local bname=$(basename "$f")
			[[ "$bname" == *"dbg"* ]] && continue
			if [[ "$bname" != "${expected_dtb}_"* ]]; then
				display_alert "Renaming DTB deb" "$bname -> ${expected_dtb}_${REVISION}_${ARCH}.deb" "wrn"
				mv "$f" "${DEB_STORAGE}/${expected_dtb}_${REVISION}_${ARCH}.deb"
			fi
		done
		for f in "${DEB_STORAGE}"/linux-headers-[0-9]*"${LINUXFAMILY}"*_${REVISION}_${ARCH}.deb; do
			[[ -f "$f" ]] || continue
			local bname=$(basename "$f")
			[[ "$bname" == *"dbg"* ]] && continue
			if [[ "$bname" != "${expected_hdr}_"* ]]; then
				display_alert "Renaming headers deb" "$bname -> ${expected_hdr}_${REVISION}_${ARCH}.deb" "wrn"
				mv "$f" "${DEB_STORAGE}/${expected_hdr}_${REVISION}_${ARCH}.deb"
			fi
		done
	fi
}

# Desktop tweaks for Orange Pi 4 Pro
function post_family_tweaks__orangepi4pro_desktop() {
	if [[ $BUILD_DESKTOP == yes ]]; then
		chroot_sdcard_apt_get_install vlc mpv

		if [[ -f "${SDCARD}/usr/share/pulseaudio/alsa-mixer/profile-sets/default.conf" ]]; then
			sed -i "s/auto-profiles = yes/auto-profiles = no/" "${SDCARD}/usr/share/pulseaudio/alsa-mixer/profile-sets/default.conf"
		fi

		echo "load-module module-alsa-sink device=hw:0,0 sink_name=HDMI-Playback sink_properties=\"device.description='HDMI Audio'\"" >> "${SDCARD}/etc/pulse/default.pa"
		echo "load-module module-alsa-sink device=hw:1,0 sink_name=AudioCodec-Playback sink_properties=\"device.description='Audio Codec'\"" >> "${SDCARD}/etc/pulse/default.pa"
	fi
}
